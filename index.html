<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#d9dde3;--ac:#2563eb;--hl:#fff3a3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#343841;--ac:#6ea0ff;--hl:#5a4d00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#343841;--ac:#6ea0ff;--hl:#5a4d00;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.box{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:10px}

label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
input:focus{outline:2px solid var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin:6px 0}
button{background:none;border:1px solid var(--bd);color:var(--tx);padding:6px 12px;border-radius:8px;font-size:13px}
.w{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);font-size:12px;color:var(--mu)}
td.l{font-weight:700;color:var(--ac)}
mark{background:var(--hl);color:inherit;border-radius:3px}
.e{padding:22px;text-align:center;color:var(--mu)}
select{padding:9px;font-size:14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
textarea{width:100%;min-height:120px;padding:10px;font-size:14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:8px}
td[contenteditable]{min-width:56px}
td[contenteditable]:focus{outline:2px solid var(--ac);background:var(--bg)}
.x{padding:2px 8px;color:#dc2626}
.sb{padding:5px 11px;font-size:13px;margin-inline-start:4px}
.sb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mp{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;direction:ltr;margin:8px 0}
.mc{border:0;border-radius:8px;padding:11px 0;font-size:13px;font-weight:700;background:#22c55e;color:#06260f}
.mc.o{background:#dc2626;color:#fff}
.mc.d{background:#2563eb;color:#fff}
.mc.k{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #777}
.mc.c{box-shadow:inset 0 0 0 3px #000}
#pop{position:fixed;z-index:9;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.6;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.mc.m{outline:2px dashed var(--tx);outline-offset:-4px}
.mc.sel{outline:3px solid var(--tx)}
.tg{padding:5px 14px;font-size:13px}
.tg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{color:var(--ac)}
.hint{font-size:12px;color:var(--mu);margin:0 0 6px}
</style>

<button id="mt">🗺️ الخريطة</button><button id="xbtn">📁 ملف إكسل</button><input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden><button id="pbtn">📋 لصق من إكسل</button><label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="rep" style="width:auto;padding:0">استبدال الكل</label><button id="add">➕ صف</button><button id="cp">نسخ النتائج</button><button id="clr">مسح البحث</button><button id="rst">رجوع للأصل</button>

<div id="mp" class="mp"><div class="tools" style="margin:0"><button id="mB" class="tg on">لاينات B</button><button id="mA" class="tg">لاينات A</button><span id="ms" class="hint" style="align-self:center;margin:0"></span></div><div id="mg" class="mg"></div><div id="md" class="hint" style="margin:0"></div><div id="mc2" style="display:none;gap:6px;flex-wrap:wrap;margin-top:8px"><button id="cO" style="background:#dc2626;color:#fff;border-color:#dc2626">🔴 مشغول</button><button id="cF" style="background:#22c55e;color:#06260f;border-color:#22c55e">🟢 فاضي</button><button id="cA">↩ تلقائي (من الجدول)</button></div></div>

<script>

var D0=RAW.split("\n").map(function(r){var p=r.split("|");return{st:p[0],store:p[1],line:p[2]||""}});
var K="stdata_v1",nid=1,D=D0.map(function(x){return Object.assign({},x)});
try{var sv=localStorage.getItem(K);if(sv){var pj=JSON.parse(sv);if(Array.isArray(pj)&&pj.length)D=pj}}catch(e){}
function ids(){D.forEach(function(x){if(x.id&&x.id>=nid)nid=x.id+1});D.forEach(function(x){if(!x.id)x.id=nid++})}
ids();
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var srt=document.getElementById("srt");
function sel(v){return ['دوك','استكمال'].map(function(n){return '<button class="sb'+(v===n?' on':'')+'" data-st="'+n+'">'+n+'</button>'}).join('')}
function lk(l){var s=String(l).toUpperCase().replace(/\s/g,""),m=s.match(/(\d+)/),t=s.slice(-1);return{n:m?+m[1]:1e9,L:t==="A"?0:t==="B"?1:2}}
var SORTS={
st_desc:function(a,b){return b.st.localeCompare(a.st)},
st_asc:function(a,b){return a.st.localeCompare(b.st)},
store:function(a,b){return a.store.localeCompare(b.store,"en",{sensitivity:"base",numeric:true})||a.st.localeCompare(b.st)},
line_ab:function(a,b){var x=lk(a.line),y=lk(b.line);return x.L-y.L||x.n-y.n},
line_n:function(a,b){var x=lk(a.line),y=lk(b.line);return x.n-y.n||x.L-y.L}
};
function lineKeys(l){var k=[];String(l).split(/[,،;]/).forEach(function(p){k=k.concat(lineKeys1(p))});return k}
function lineKeys1(l){
  var s=l.toUpperCase().replace(/\s/g,""),k=[s];if(!s)return k;
  var m=s.match(/^(.*?)([AB])$/),L=m?m[2]:"",body=m?m[1]:s;
  body.split("+").forEach(function(n){k.push(n);if(L)k.push(n+L)});
  return k;
}
var q1=document.getElementById("q1"),q2=document.getElementById("q2"),q3=document.getElementById("q3"),tb=document.getElementById("tb"),cnt=document.getElementById("cnt");
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function hl(t,q){
  if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());
  return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));
}
function run(){
  var a=q1.value.trim(),b=q2.value.trim().toUpperCase().replace(/\s/g,""),c=q3.value.trim().toLowerCase();
  var r=D.filter(function(x){
    if(a&&!(a.length<=3?x.st.slice(-3).indexOf(a)===0:x.st.toLowerCase().indexOf(a.toLowerCase())>-1))return false;
    if(b&&lineKeys(x.line).indexOf(b)<0)return false;
    if(c&&x.store.toLowerCase().indexOf(c)<0)return false;
    return true;
  });
  if(SORTS[srt.value])r.sort(SORTS[srt.value]);
  drawMap();
  cnt.textContent="النتائج: "+r.length+" من "+D.length;
  tb.innerHTML=r.length?r.map(function(x){
    return"<tr data-id=\""+x.id+"\"><td contenteditable=\"true\" data-f=\"st\">"+esc(x.st.slice(0,-3))+"<mark>"+esc(x.st.slice(-3))+"</mark></td><td contenteditable=\"true\" data-f=\"store\">"+hl(x.store,c)+"</td><td class=\"l\" contenteditable=\"true\" data-f=\"line\">"+esc(x.line)+"</td><td>"+sel(x.s)+"</td><td><button class=\"x\" data-del=\"1\">✕</button></td></tr>";
  }).join(""):"<tr><td colspan=\"5\" class=\"e\">مفيش نتائج</td></tr>";
}
[q1,q2,q3].forEach(function(e){e.addEventListener("input",run)});
var msg=document.getElementById("msg"),pp=document.getElementById("pp"),pt=document.getElementById("pt"),rs=document.getElementById("rst");
function say(t){msg.textContent=t}
document.getElementById("clr").onclick=function(){q1.value=q2.value=q3.value="";run()};
srt.onchange=run;
tb.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();e.target.blur()}});
tb.addEventListener("focusout",function(e){
  var td=e.target.closest&&e.target.closest("td[data-f]");if(!td)return;
  var id=+td.parentNode.dataset.id,f=td.dataset.f,v=td.textContent.replace(/\s+/g," ").trim();
  if(f==="st")v=v.toUpperCase();
  var o=D.find(function(x){return x.id===id});
  if(o&&o[f]!==v){o[f]=v;save();drawMap();say("تم حفظ التعديل ✓")}
});
tb.addEventListener("click",function(e){
  var sb=e.target;
  if(sb.dataset&&sb.dataset.st){
    var tr=sb.closest("tr"),sid=+tr.dataset.id,so=D.find(function(x){return x.id===sid});
    if(so){so.s=(so.s===sb.dataset.st)?"":sb.dataset.st;save();
      var bs=tr.querySelectorAll(".sb");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].dataset.st===so.s);
      say(so.s?"تم تحديد: "+so.s:"تم إلغاء الحالة");drawMap()}
    return;
  }
  var b=e.target;if(!b.dataset||!b.dataset.del)return;
  if(b.dataset.sure){var id=+b.closest("tr").dataset.id;D=D.filter(function(x){return x.id!==id});save();run();say("تم حذف الصف")}
  else{b.dataset.sure=1;b.textContent="متأكد؟";setTimeout(function(){b.dataset.sure="";b.textContent="✕"},2500)}
});
function parseText(t){
  var out=[];
  t.split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l)return;
    var st,store,line,sv="",c=l.split("\t").map(function(x){return x.trim()});
    if(c.length>1){st=c[0];store=c[1];line=c[2]||"";sv=(c[3]==="دوك"||c[3]==="استكمال")?c[3]:""}
    else{
      var m=l.match(/^(ST\d+)\s+(.*?\bDS\s*\d+)\s*(.*)$/i);
      if(m){st=m[1];store=m[2];line=m[3]}
      else{var p=l.split(/\s{2,}/);st=p[0];store=p[1]||"";line=p[2]||""}
    }
    if(!st||!/^ST\d+$/i.test(st))return;
    out.push({st:st.toUpperCase(),store:(store||"").trim(),line:(line||"").trim().toUpperCase(),s:sv});
  });
  return out;
}
function ingest(t,rep){
  var n=parseText(t);
  if(!n.length){say("مفيش صفوف مفهومة في اللي لصقته");return false}
  if(rep){D=n.map(function(x){x.id=nid++;return x});say("تم استبدال البيانات: "+n.length+" صف")}
  else{
    var a=0,u=0,s=0;
    n.forEach(function(x){
      var o=D.find(function(y){return y.st===x.st});
      if(!o){x.id=nid++;D.push(x);a++}
      else if((x.store&&o.store!==x.store)||(x.line&&o.line!==x.line)||(x.s&&o.s!==x.s)){if(x.store)o.store=x.store;if(x.line)o.line=x.line;if(x.s)o.s=x.s;u++}
      else s++;
    });
    say("أُضيف "+a+" • اتحدّث "+u+" • موجود زي ما هو "+s);
  }
  save();pt.value="";pp.hidden=true;run();return true;
}
var repOn=function(){return document.getElementById("rep").checked};
document.getElementById("pbtn").onclick=function(){
  var open=function(){pp.hidden=false;pt.focus();say("الصق هنا (ضغطة مطولة ← لصق) وهيتضاف على طول")};
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){if(!ingest(t,repOn()))open()}).catch(open)}else open();
};
pt.addEventListener("paste",function(e){e.preventDefault();ingest((e.clipboardData||window.clipboardData).getData("text"),repOn())});
document.addEventListener("paste",function(e){
  if(e.target.closest&&e.target.closest("input,textarea,[contenteditable]"))return;
  ingest((e.clipboardData||window.clipboardData).getData("text"),repOn());
});
document.getElementById("padd").onclick=function(){ingest(pt.value,false)};
document.getElementById("prep").onclick=function(){ingest(pt.value,true)};
document.getElementById("add").onclick=function(){
  q1.value=q2.value=q3.value="";srt.value="";D.unshift({id:nid++,st:"ST",store:"",line:""});save();run();say("صف جديد في الأول، عدّل خاناته");
};
document.getElementById("cp").onclick=function(){
  var rows=Array.prototype.filter.call(tb.rows,function(r){return r.dataset.id});
  var t=rows.map(function(r){return[0,1,2].map(function(i){return r.cells[i].textContent}).concat((r.querySelector(".sb.on")||{textContent:""}).textContent).join("\t")}).join("\n");
  var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  ta.remove();say(ok?"تم نسخ "+rows.length+" صف (جاهز للصق في إكسل)":"النسخ مش متاح هنا");
};
var MP="B",msel=0;
var OV={};try{OV=JSON.parse(localStorage.getItem("stov_v1")||"{}")||{}}catch(e){}
function saveOV(){try{localStorage.setItem("stov_v1",JSON.stringify(OV))}catch(e){}}
function occ(L){
  var m={};
  D.forEach(function(x){
    String(x.line||"").toUpperCase().split(/[,،;]/).forEach(function(s){s=s.replace(/\s/g,"");
    if(s.slice(-1)!==L)return;
    s.slice(0,-1).split("+").forEach(function(n){if(/^\d+$/.test(n)){(m[+n]=m[+n]||[]).push(x)}});});
  });
  return m;
}
function drawMap(){
  document.getElementById("pop").hidden=true;var m=occ(MP),h="",used=0,dups=0,docks=0;
  for(var i=1;i<=55;i++){
    var k=MP+i,ov=OV[k],all=m[i]||[],act=all.filter(function(x){return x.s!=="دوك"}),dk=!ov&&all.length>0&&!act.length,o=ov?ov==="o":act.length>0,dup=!ov&&act.length>1,cmp=act.some(function(x){return x.s==="استكمال"});if(o)used++;if(dup)dups++;if(dk)docks++;
    h+='<button class="mc'+(o?' o':'')+(dk?' k':'')+(cmp&&o?' c':'')+(dup?' d':'')+(ov?' m':'')+(msel===i?' sel':'')+'" data-n="'+i+'">'+i+MP+(dup?'<br><small>×'+act.length+'</small>':'')+'</button>';
  }
  document.getElementById("mg").innerHTML=h;
  document.getElementById("ms").textContent="🔴 مشغول: "+used+"   🟢 فاضي: "+(55-used-docks)+(docks?"   ⚫ دوك: "+docks:"")+(dups?"   🔵 مكرر: "+dups:"");
  document.getElementById("md").textContent=msel?(m[msel]?msel+MP+" ← "+m[msel].map(function(x){return x.store+" ("+x.st+")"}).join(" ، "):msel+MP+" فاضي"):"اضغط على أي لاين عشان تشوف مين واخده";
  var kk=MP+msel;if(msel&&OV[kk])document.getElementById("md").textContent+=" — يدوي: "+(OV[kk]==="o"?"مشغول":"فاضي");
  document.getElementById("mc2").style.display=msel?"flex":"none";
}
function setM(L){MP=L;msel=0;document.getElementById("mB").classList.toggle("on",L==="B");document.getElementById("mA").classList.toggle("on",L==="A");drawMap()}

function setOV(v){if(!msel)return;var k=MP+msel;if(v)OV[k]=v;else delete OV[k];saveOV();drawMap()}

var popN=0;
function findST(v){
  var d=String(v).trim().toUpperCase().replace(/\s/g,"").replace(/^ST/,"");
  if(!/^\d+$/.test(d))return{err:"اكتب رقم ST (أرقام بس)"};
  if(d.length<=3){
    var c=D.filter(function(x){return x.st.slice(-d.length)===d});
    if(c.length===1)return{row:c[0]};
    return{err:c.length?"فيه "+c.length+" ST بينتهوا بـ "+d+"، اكتب أكتر":"مش موجود، اكتب الرقم كامل عشان يتضاف"};
  }
  var st="ST"+(d.length<6?("000000"+d).slice(-6):d),row=D.find(function(x){return x.st===st});
  return row?{row:row}:{st:st};
}
function addLine(row,n,L){
  var parts=String(row.line||"").split(/[,،;]/).map(function(p){return p.trim()}).filter(Boolean),done=false;
  parts=parts.map(function(p){
    var u=p.toUpperCase().replace(/\s/g,"");
    if(!done&&u.slice(-1)===L){
      var nums=u.slice(0,-1).split("+").filter(Boolean);
      if(nums.indexOf(String(n))<0)nums.push(String(n));
      nums.sort(function(a,b){return a-b});done=true;return nums.join("+")+L;
    }
    return p;
  });
  if(!done)parts.push(n+L);
  row.line=parts.join(",");
}
function popGo(){
  if(!popN)return;
  var r=findST(document.getElementById("popst").value);
  if(r.err){document.getElementById("popl").textContent=r.err;return}
  var row=r.row;
  if(!row){row={id:nid++,st:r.st,store:"",line:""};D.unshift(row)}
  addLine(row,popN,MP);delete OV[MP+popN];saveOV();save();
  document.getElementById("pop").hidden=true;msel=0;
  q1.value=row.st.slice(-3);q2.value="";q3.value="";
  run();say("تم: "+popN+MP+" ← "+(row.store||"ST جديد، كمّل الفرع من الجدول")+" ("+row.st+")");
}
document.getElementById("popgo").onclick=popGo;
document.getElementById("popst").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();popGo()}});

xf.onchange=function(){
  var f=xf.files&&xf.files[0];if(!f)return;
  if(typeof XLSX==="undefined"){say("محتاج إنترنت عشان قراءة ملف الإكسل");xf.value="";return}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(rd.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
      var t=rows.map(function(r){return r.slice(0,4).map(function(c){return String(c).trim()}).join("\t")}).join("\n");
      ingest(t,repOn());
    }catch(err){say("مقدرتش أقرا الملف ده")}
    xf.value="";
  };
  rd.onerror=function(){say("مقدرتش أقرا الملف ده")};
  rd.readAsArrayBuffer(f);
};
