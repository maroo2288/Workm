<style>
:root{
  --bg:#f1f5f9;--card:rgba(255,255,255,0.92);--tx:#0f172a;--mu:#64748b;
  --bd:#cbd5e1;--ac:#2563eb;--ac-h:#1d4ed8;--hl:#fef08a;--sh:0 4px 20px rgba(15,23,42,0.06);
  --grid-c:rgba(37,99,235,0.06);--grad:linear-gradient(135deg,#e0e7ff 0%,#f8fafc 50%,#dcfce7 100%);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1120;--card:rgba(30,41,59,0.9);--tx:#f1f5f9;--mu:#94a3b8;
  --bd:#334155;--ac:#3b82f6;--ac-h:#60a5fa;--hl:#854d0e;--sh:0 4px 20px rgba(0,0,0,0.4);
  --grid-c:rgba(59,130,246,0.08);--grad:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#064e3b 100%);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));
  min-height:100vh;background-color:var(--bg);transition:background .3s,color .3s;
}
/* أنماط الخلفيات */
body.bg-grid{
  background-image:linear-gradient(var(--grid-c) 1px,transparent 1px),linear-gradient(90deg,var(--grid-c) 1px,transparent 1px);
  background-size:24px 24px;
}
body.bg-grad{background-image:var(--grad);background-attachment:fixed}
body.bg-solid{background-image:none}

.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px}
.hdr-acts{display:flex;gap:6px;align-items:center}
.ibtn{
  background:var(--card);border:1px solid var(--bd);color:var(--tx);
  padding:7px 10px;border-radius:10px;font-size:13px;cursor:pointer;
  backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:4px;font-weight:600;
}
.ibtn:active{transform:scale(.96)}
.ibtn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}

.card{
  background:var(--card);border:1px solid var(--bd);border-radius:14px;
  padding:12px;margin-bottom:12px;box-shadow:var(--sh);backdrop-filter:blur(10px);
}
.box{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.box{grid-template-columns:repeat(3,1fr)}}
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin-bottom:4px}
input,select,textarea{
  width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--bd);
  border-radius:10px;background:var(--bg);color:var(--tx);transition:border .2s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.2)}

.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.w{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:rgba(148,163,184,0.1);font-size:12px;color:var(--mu);font-weight:700}
td.l{font-weight:800;color:var(--ac);font-size:15px}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.e{padding:28px;text-align:center;color:var(--mu)}
td[contenteditable]{min-width:60px;border-radius:6px}
td[contenteditable]:focus{outline:2px solid var(--ac);background:var(--bg)}

.sb{padding:5px 10px;font-size:12px;font-weight:600;margin-inline-start:4px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.sb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.x{padding:4px 9px;color:#ef4444;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);border-radius:8px;cursor:pointer;font-weight:700}

/* الخريطة */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mu);margin:8px 0;padding:6px 8px;background:var(--bg);border-radius:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;direction:ltr;margin:10px 0}
.mc{border:0;border-radius:10px;padding:11px 0;font-size:13px;font-weight:800;background:#22c55e;color:#052e16;cursor:pointer;transition:transform .1s}
.mc:active{transform:scale(.93)}
.mc.o{background:#ef4444;color:#fff}
.mc.d{background:#2563eb;color:#fff}
.mc.k{background:#0f172a;color:#fff;box-shadow:inset 0 0 0 1px #64748b}
.mc.c{box-shadow:inset 0 0 0 3px #facc15}
.mc.m{outline:2px dashed var(--tx);outline-offset:-4px}
.mc.sel{outline:3px solid var(--tx);transform:scale(1.05)}
.tg{padding:6px 14px;font-size:13px;font-weight:700;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.tg.on{background:var(--ac);color:#fff;border-color:var(--ac)}

#pop{position:fixed;z-index:20;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;max-width:250px;box-shadow:0 10px 25px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
#toast{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(100px);
  background:#0f172a;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:50;transition:transform .3s cubic-bezier(.18,.89,.32,1.28);pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin:8px 4px}
.hint{font-size:12px;color:var(--mu);margin:4px 0}
</style>

<script>
/* تسجيل الـ Service Worker للتثبيت والعمل أوفلاين */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;installBtn.hidden=false;
});
installBtn.onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted')installBtn.hidden=true;
  deferredPrompt=null;
};

/* الثيم والخلفيات */
const themes=['light','dark'];
let curTh=localStorage.getItem('workm_th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.setAttribute('data-theme',curTh);
document.getElementById('thBtn').onclick=()=>{
  curTh=curTh==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',curTh);
  localStorage.setItem('workm_th',curTh);
  say(curTh==='dark'?'الوضع الليلي 🌙':'الوضع النهاري ☀️');
};

const bgs=['bg-grid','bg-grad','bg-solid'];
const bgNames={'bg-grid':'خلفية شبكية هندسية','bg-grad':'خلفية متدرجة ناعمة','bg-solid':'خلفية سادة'};
let curBg=localStorage.getItem('workm_bg')||'bg-grid';
document.body.className=curBg;
document.getElementById('bgBtn').onclick=()=>{
  curBg=bgs[(bgs.indexOf(curBg)+1)%bgs.length];
  document.body.className=curBg;
  localStorage.setItem('workm_bg',curBg);
  say(bgNames[curBg]);
};

document.getElementById('moreBtn').onclick=()=>{
  const m=document.getElementById('moreMenu');m.hidden=!m.hidden;
};

/* البيانات الأساسية */
var RAW=`ST100217|Hadayek October-DS 44|25+27A
ST100260|Port said-DS 32|40B
ST100269|Alexandria Agamy-DS 67|15+17A
ST100234|Suez-DS 65|13B

ST100309|Zakazik-DS 33|46B
ST100549|Alex (Sidi bishr)-DS 26|19A
ST100520|shrouk-Ds29|13A
ST100501|Hadayek El Ahram 2-DS 78|47B
ST100310|Zakazik-DS 33|20A
ST100490|Zayed (2)-DS 53|11B

ST100092|Obour-DS 30|45B
ST099795|Tagmoa Awal-DS 37|14A
ST100320|Hurgada-DS 38|3B

ST100275|Alexandria El Seyouf-DS 79|37B
ST100543|Faisal Maryoteya (2)-DS 54|6B

ST099589|Madinty-DS 23|29A

ST100528|Nasr City (3) DS 59|34B

ST100343|Heliopolis Sheraton-DS 52|24B
ST100478|Tagamoa5 Mahkama-DS 43|1B
ST100468|Rehab-DS 3|5B
ST100546|Tagamoa 5 Spot Mall-DS 64|31B
ST100512|Madinaty Craft-DS 39|51B
ST100574|Nasr City(4)-DS 63|11A
ST100514|First Mall-DS 19|27A
ST100253|Mokattam -Ds 6|32B
ST100540|Nasrcity 10th-DS 40|26B
ST100291|October industrial-DS 47|`;

var D0=RAW.split("\n").map(r=>{var p=r.split("|");return{st:p[0],store:p[1],line:p[2]||""}});
var K="stdata_v1",nid=1,D=D0.map(x=>Object.assign({},x)),hist=[];
try{var sv=localStorage.getItem(K);if(sv){var pj=JSON.parse(sv);if(Array.isArray(pj)&&pj.length)D=pj}}catch(e){}
function ids(){D.forEach(x=>{if(x.id&&x.id>=nid)nid=x.id+1});D.forEach(x=>{if(!x.id)x.id=nid++})}
ids();

function pushHist(){
  hist.push(JSON.stringify(D));
  if(hist.length>20)hist.shift();
  document.getElementById('undoBtn').disabled=false;
}
document.getElementById('undoBtn').onclick=()=>{
  if(!hist.length)return;
  D=JSON.parse(hist.pop());
  document.getElementById('undoBtn').disabled=!hist.length;
  save(true);run();say("تم التراجع عن آخر خطوة ↩");
};

function save(skipHist){
  try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
}

let toastT;
function say(t){
  const el=document.getElementById('toast');
  el.textContent=t;el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2600);
}

var srt=document.getElementById("srt"),curFlt="all";
document.getElementById("flts").onclick=e=>{
  const b=e.target.closest(".chip");if(!b)return;
  curFlt=b.dataset.flt;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  run();
};

function sel(v){return ['دوك','استكمال'].map(n=>'<button class="sb'+(v===n?' on':'')+'" data-st="'+n+'">'+n+'</button>').join('')}
function lk(l){var s=String(l).toUpperCase().replace(/\s/g,""),m=s.match(/(\d+)/),t=s.slice(-1);return{n:m?+m[1]:1e9,L:t==="A"?0:t==="B"?1:2}}
var SORTS={
  st_desc:(a,b)=>b.st.localeCompare(a.st),
  st_asc:(a,b)=>a.st.localeCompare(b.st),
  store:(a,b)=>a.store.localeCompare(b.store,"en",{sensitivity:"base",numeric:true})||a.st.localeCompare(b.st),
  line_ab:(a,b)=>{var x=lk(a.line),y=lk(b.line);return x.L-y.L||x.n-y.n},
  line_n:(a,b)=>{var x=lk(a.line),y=lk(b.line);return x.n-y.n||x.L-y.L}
};
function lineKeys(l){var k=[];String(l).split(/[,،;]/).forEach(p=>{k=k.concat(lineKeys1(p))});return k}
function lineKeys1(l){
  var s=l.toUpperCase().replace(/\s/g,""),k=[s];if(!s)return k;
  var m=s.match(/^(.*?)([AB])$/),L=m?m[2]:"",body=m?m[1]:s;
  body.split("+").forEach(n=>{k.push(n);if(L)k.push(n+L)});
  return k;
}

var q1=document.getElementById("q1"),q2=document.getElementById("q2"),q3=document.getElementById("q3"),tb=document.getElementById("tb"),cnt=document.getElementById("cnt");
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function hl(t,q){
  if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());
  return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));
}

let lastFiltered=[];
function run(){
  var a=q1.value.trim(),b=q2.value.trim().toUpperCase().replace(/\s/g,""),c=q3.value.trim().toLowerCase();
  var r=D.filter(x=>{
    if(curFlt==="dock"&&x.s!=="دوك")return false;
    if(curFlt==="comp"&&x.s!=="استكمال")return false;
    if(curFlt==="noline"&&String(x.line||"").trim()!=="")return false;
    if(a&&!(a.length<=3?x.st.slice(-3).indexOf(a)===0:x.st.toLowerCase().indexOf(a.toLowerCase())>-1))return false;
    if(b&&lineKeys(x.line).indexOf(b)<0)return false;
    if(c&&x.store.toLowerCase().indexOf(c)<0)return false;
    return true;
  });
  if(SORTS[srt.value])r.sort(SORTS[srt.value]);
  lastFiltered=r;
  drawMap();
  cnt.textContent="النتائج: "+r.length+" من "+D.length;

    `<tr data-id="${x.id}"><td contenteditable="true" data-f="st">${esc(x.st.slice(0,-3))}<mark>${esc(x.st.slice(-3))}</mark></td><td contenteditable="true" data-f="store">${hl(x.store,c)}</td><td class="l" contenteditable="true" data-f="line">${esc(x.line)}</td><td>${sel(x.s)}</td><td><button class="x" data-del="1">✕</button></td></tr>`
  ).join(""):'<tr><td colspan="5" class="e">مفيش نتائج مطابقة</td></tr>';
}

function parseText(t){
  var out=[];
  t.split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l)return;
    var st,store,line,sv="",c=l.split("\t").map(x=>x.trim());
    if(c.length>1){st=c[0];store=c[1];line=c[2]||"";sv=(c[3]==="دوك"||c[3]==="استكمال")?c[3]:""}
    else{
      var m=l.match(/^(ST\d+)\s+(.*?\bDS\s*\d+)\s*(.*)$/i);
      if(m){st=m[1];store=m[2];line=m[3]}
      else{var p=l.split(/\s{2,}/);st=p[0];store=p[1]||"";line=p[2]||""}
    }
    if(!st||!/^ST\d+$/i.test(st))return;
    out.push({st:st.toUpperCase(),store:(store||"").trim(),line:(line||"").trim().toUpperCase(),s:sv});
  });
  return out;
}
function ingest(t,rep){
  var n=parseText(t);
  if(!n.length){say("مفيش صفوف مفهومة في اللي لصقته");return false}
  pushHist();
  if(rep){D=n.map(x=>{x.id=nid++;return x});say("تم استبدال البيانات: "+n.length+" صف")}
  else{
    var a=0,u=0,s=0;
    n.forEach(x=>{
      var o=D.find(y=>y.st===x.st);
      if(!o){x.id=nid++;D.push(x);a++}
      else if((x.store&&o.store!==x.store)||(x.line&&o.line!==x.line)||(x.s&&o.s!==x.s)){if(x.store)o.store=x.store;if(x.line)o.line=x.line;if(x.s)o.s=x.s;u++}
      else s++;
    });
    say("أُضيف "+a+" • اتحدّث "+u+" • موجود "+s);
  }
  save();pt.value="";pp.hidden=true;run();return true;
}

};

var MP="B",msel=0;
var OV={};try{OV=JSON.parse(localStorage.getItem("stov_v1")||"{}")||{}}catch(e){}
function saveOV(){try{localStorage.setItem("stov_v1",JSON.stringify(OV))}catch(e){}}
function occ(L){
  var m={};
  D.forEach(x=>{
    String(x.line||"").toUpperCase().split(/[,،;]/).forEach(s=>{s=s.replace(/\s/g,"");
    if(s.slice(-1)!==L)return;
    s.slice(0,-1).split("+").forEach(n=>{if(/^\d+$/.test(n)){(m[+n]=m[+n]||[]).push(x)}});});
  });
  return m;
}
function drawMap(){
  document.getElementById("pop").hidden=true;var m=occ(MP),h="",used=0,dups=0,docks=0;
  for(var i=1;i<=55;i++){
    var k=MP+i,ov=OV[k],all=m[i]||[],act=all.filter(x=>x.s!=="دوك"),dk=!ov&&all.length>0&&!act.length,o=ov?ov==="o":act.length>0,dup=!ov&&act.length>1,cmp=act.some(x=>x.s==="استكمال");if(o)used++;if(dup)dups++;if(dk)docks++;
    h+='<button class="mc'+(o?' o':'')+(dk?' k':'')+(cmp&&o?' c':'')+(dup?' d':'')+(ov?' m':'')+(msel===i?' sel':'')+'" data-n="'+i+'">'+i+MP+(dup?'<br><small>×'+act.length+'</small>':'')+'</button>';
  }
  document.getElementById("mg").innerHTML=h;
  document.getElementById("ms").textContent="🔴 "+used+"  🟢 "+(55-used-docks)+(docks?"  ⚫ "+docks:"")+(dups?"  🔵 "+dups:"");
  document.getElementById("md").textContent=msel?(m[msel]?msel+MP+" ← "+m[msel].map(x=>x.store+" ("+x.st+")").join(" ، "):msel+MP+" فاضي"):"اضغط على أي لاين للتفاصيل أو التسكين السريع";
  var kk=MP+msel;if(msel&&OV[kk])document.getElementById("md").textContent+=" — يدوي: "+(OV[kk]==="o"?"مشغول":"فاضي");
  document.getElementById("mc2").style.display=msel?"flex":"none";
}

    document.getElementById("popf").style.display=(wasO||wasDup)?"none":"flex";popN=+n;

});

var popN=0;
function findST(v){
  var d=String(v).trim().toUpperCase().replace(/\s/g,"").replace(/^ST/,"");
  if(!/^\d+$/.test(d))return{err:"اكتب رقم ST (أرقام بس)"};
  if(d.length<=3){
    var c=D.filter(x=>x.st.slice(-d.length)===d);
    if(c.length===1)return{row:c[0]};
    return{err:c.length?"فيه "+c.length+" ST بينتهوا بـ "+d+"، اكتب أكتر":"مش موجود، اكتب الرقم كامل عشان يتضاف"};
  }
  var st="ST"+(d.length<6?("000000"+d).slice(-6):d),row=D.find(x=>x.st===st);
  return row?{row:row}:{st:st};
}
function addLine(row,n,L){
  var parts=String(row.line||"").split(/[,،;]/).map(p=>p.trim()).filter(Boolean),done=false;
  parts=parts.map(p=>{
    var u=p.toUpperCase().replace(/\s/g,"");
    if(!done&&u.slice(-1)===L){
      var nums=u.slice(0,-1).split("+").filter(Boolean);
      if(nums.indexOf(String(n))<0)nums.push(String(n));
      nums.sort((a,b)=>a-b);done=true;return nums.join("+")+L;
    }
    return p;
  });
  if(!done)parts.push(n+L);
  row.line=parts.join(",");
}
function popGo(){
  if(!popN)return;
  var r=findST(document.getElementById("popst").value);
  if(r.err){document.getElementById("popl").textContent=r.err;return}
  pushHist();
  var row=r.row;
  if(!row){row={id:nid++,st:r.st,store:"",line:""};D.unshift(row)}
  addLine(row,popN,MP);delete OV[MP+popN];saveOV();save();
  document.getElementById("pop").hidden=true;msel=0;
  q1.value=row.st.slice(-3);q2.value="";q3.value="";
  run();say("تم تسكين "+popN+MP+" ← "+(row.store||row.st));
}
